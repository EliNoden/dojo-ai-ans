[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "semver>=3.1.0",
]

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
exclude = ["^mutants/"]

[tool.mutmut]
source_paths = ["versioning.py"]
pytest_add_cli_args_test_selection = ["tests/test_versioning.py"]
